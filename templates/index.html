<!DOCTYPE html>
<html>

<head>

    <title>Movie Recommendation System</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>      

<nav class="navbar">

    <div class="nav-container">

        <a href="/" class="logo">
            ✦ CineMatch
        </a>

        <div class="nav-links">

            <a href="/">Home</a>

        </div>

    </div>

</nav>


<div class="container">

<div class="hero-section">

    <h1>✦ Your Next Great Watch</h1>

    <p>
        Discover movies you'll love with intelligent recommendations.
    </p>

    <form action="/search" method="GET" class="search-form">

        <input
            type="text"
            name="query"
            placeholder="Search for a movie..."
            required
        >

        <button type="submit">
            Search
        </button>

    </form>

</div>


    <div class="movie-grid">

        {% for movie in movies %}

            <div class="movie-card">

                <a href="/movie/{{ movie.movie_id }}">

                    {% if movie.poster_url %}

                        <img
                            src="{{ movie.poster_url }}"
                            alt="{{ movie.title }}"
                            class="recommendation-poster"
                        >

                    {% endif %}

                    <h3>
                        {{ movie.title }}
                    </h3>

                </a>

            </div>

        {% endfor %}

    </div>

</div>


</body>

</html>
